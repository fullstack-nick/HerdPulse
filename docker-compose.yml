name: herd-pulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: herd_pulse
      POSTGRES_USER: herd
      POSTGRES_PASSWORD: herd_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U herd -d herd_pulse']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 8s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ['auth']
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./infrastructure/keycloak/herd-pulse-realm.json:/opt/keycloak/data/import/herd-pulse-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ['observability']
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: herdpulse
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infrastructure/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yml']
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infrastructure/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    profiles: ['observability']
    ports:
      - '16686:16686'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  keycloak-data:
  grafana-data:
